name: Provan release gate

on:
  push:
  pull_request:

jobs:
  test-and-eval:
    runs-on: windows-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: python scripts/run_evals.py
      - run: python scripts/run_workflow_integration_evals.py
      - run: python -m build
      - run: python scripts/validate_session9.py --wheel dist/*.whl --archive dist/*.tar.gz
      - run: python scripts/validate_session9_correction.py
      - run: python scripts/validate_session9_leakage.py
