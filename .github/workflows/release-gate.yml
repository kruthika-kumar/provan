name: Provan release gate

on:
  push:
  pull_request:

jobs:
  test-and-eval:
    runs-on: windows-latest
    env:
      PYTHONPATH: .
      PROVAN_PUBLICATION_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      PROVAN_PUBLICATION_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      PROVAN_INTEGRATION_HEAD: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: python scripts/run_evals.py
      - run: python scripts/run_workflow_integration_evals.py
      - run: python -m build --outdir candidate-dist
      - run: python scripts/validate_session9.py --skip-closeout-bindings --wheel candidate-dist/*.whl --archive candidate-dist/*.tar.gz
      - run: python scripts/validate_session9_correction.py
      - run: python scripts/validate_session9_leakage.py
      - run: python scripts/validate_session10_successor.py
      - run: python scripts/validate_session11.py --phase final
      - run: python scripts/validate_session11_successor_closeout.py
      - run: python scripts/fresh_install_gate.py --wheel dist/provan_assurance-0.4.0-py3-none-any.whl
      - run: python -c "from pathlib import Path; import hashlib; expected='e250c509d1676ebb9f1ec066059b3eb770a12a3804666c22a1e65bfad6d89d4f'; actual=hashlib.sha256(Path('dist/provan_assurance-0.4.0-py3-none-any.whl').read_bytes()).hexdigest(); assert actual==expected, (actual,expected)"
      - uses: actions/upload-artifact@v7
        with:
          name: session11-wheel
          path: |
            dist/provan_assurance-0.4.0-py3-none-any.whl
            candidate-dist/provan_assurance-0.4.0-py3-none-any.whl
          if-no-files-found: error
