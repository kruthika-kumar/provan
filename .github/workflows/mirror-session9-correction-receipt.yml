name: Mirror Session 9 correction receipt

on:
  workflow_dispatch:
    inputs:
      receipt_base64:
        description: Canonical external receipt bytes encoded as base64
        required: true
        type: string
      expected_sha256:
        description: SHA-256 of the complete decoded file
        required: true
        type: string

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Decode and verify without logging payload
        shell: bash
        env:
          RECEIPT_BASE64: ${{ inputs.receipt_base64 }}
          EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
        run: |
          set +x
          umask 077
          mkdir receipt
          printf '%s' "$RECEIPT_BASE64" | base64 --decode > receipt/session9-closeout-correction.external.v1.json
          printf '%s  %s\n' "$EXPECTED_SHA256" receipt/session9-closeout-correction.external.v1.json | sha256sum --check --status
      - name: Upload exact canonical bytes
        uses: actions/upload-artifact@v4
        with:
          name: session9-closeout-correction-external-receipt
          path: receipt/session9-closeout-correction.external.v1.json
          if-no-files-found: error
          retention-days: 30
