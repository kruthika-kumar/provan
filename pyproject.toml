[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "provan-assurance"
version = "0.2.0"
description = "Read-only, evidence-gated repository assurance"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.23", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=9.0", "jsonschema>=4.23", "build>=1.2"]
telemetry = ["opentelemetry-api>=1.30", "opentelemetry-sdk>=1.30", "opentelemetry-exporter-otlp>=1.30"]
convex = ["convex>=0.7"]
voice = ["elevenlabs>=2.0"]

[project.scripts]
provan = "provan.cli:main"
shiproom = "provan.compat:legacy_cli_main"

[project.entry-points."provan.extensions"]
noop = "provan.extensions:noop_provider"

[tool.setuptools.packages.find]
include = ["provan*"]
exclude = ["skills*", "tests*"]

[tool.setuptools.package-data]
"provan" = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
