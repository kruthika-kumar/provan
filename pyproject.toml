[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shiproom"
version = "0.1.0"
description = "Evidence-gated release assurance operated by Hermes"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
shiproom = "shiproom.cli:main"

[tool.setuptools.packages.find]
include = ["shiproom*", "demo_patient*"]
exclude = ["skills*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
